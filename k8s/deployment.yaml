apiVersion: v1
kind: Namespace
metadata:
  name: football
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-players
  namespace: football
spec:
  replicas: 2
  selector:
    matchLabels: { app: football-players }
  template:
    metadata:
      labels: { app: football-players }
    spec:
      containers:
        - name: football-players
          image: IMAGE_PLACEHOLDER # Jenkins replaces this with darshan1103/football-players:<build no.>
          ports: [{ containerPort: 8080 }]
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: football-secret
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: football-secret
                  key: db-password
          readinessProbe:
            httpGet: { path: /api/players, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: football-players
  namespace: football
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  selector: { app: football-players }
  ports: [{ port: 80, targetPort: 8080 }]